name: Release binaries

on:
  push:
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare tag release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release draft for the pushed tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
          fi

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos-arm64
            archive: tar.gz
          - os: windows-2022
            target: win-x64
            archive: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.7'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --group build
      - run: uv run --locked --group build pylearn package --target ${{ matrix.target }}
      - run: npx tsc --noEmit
      - run: uv run --locked python -m unittest discover -s meta/tests -v
      - name: Test extracted native application
        run: uv run --locked python scripts/smoke_binary.py outputs/release/PyPath-${{ matrix.target }}.${{ matrix.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: PyPath-${{ matrix.target }}
          path: outputs/release/*
          if-no-files-found: error

  release:
    name: Upload packages and publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PyPath-*
          path: artifacts
          merge-multiple: true
      - name: Verify both release packages
        working-directory: artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s PyPath-macos-arm64.tar.gz
          test -s PyPath-win-x64.zip
          sha256sum --check --strict PyPath-macos-arm64.tar.gz.sha256 PyPath-win-x64.zip.sha256
      - name: Publish release after both platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            artifacts/PyPath-macos-arm64.tar.gz \
            artifacts/PyPath-macos-arm64.tar.gz.sha256 \
            artifacts/PyPath-win-x64.zip \
            artifacts/PyPath-win-x64.zip.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false
          gh release view "$RELEASE_TAG" --json url --jq '"Release: " + .url' >> "$GITHUB_STEP_SUMMARY"
