[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[project]
name = "pypath-learn"
version = "0.1.0"
description = "PyPath 本地学习项目与自动验收 CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pylearn = "py_learn.cli:main"

[tool.uv.build-backend]
module-name = "py_learn"
module-root = "meta"
